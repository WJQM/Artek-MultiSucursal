# Nginx para RepairTrackQR — copia este archivo a /etc/nginx/sites-available/repairtrack
# y cambia TU_DOMINIO por tu dominio real (ej: taller.miempresa.com).
# El HTTPS lo agrega certbot automáticamente (ver deploy/GUIA-HETZNER.md, paso 6).

server {
    listen 80;
    server_name TU_DOMINIO;

    client_max_body_size 12M;   # fotos de hasta ~10 MB

    # Imágenes subidas: las sirve Nginx directo desde la carpeta de UPLOAD_DIR (más rápido)
    location /uploads/ {
        alias /var/lib/repairtrack/uploads/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox";
        try_files $uri =404;
    }

    # Archivos estáticos de Next.js (llevan hash en el nombre: se pueden guardar un año)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Tiempo real (chat y pantallas que se actualizan solas): conexión larga sin búfer
    location = /api/live {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
